
# Server configuration
quarkus.virtual-threads.name-prefix=VirtualThreadQCD
quarkus.virtual-threads.enabled=true
quarkus.http.port=8080
quarkus.package.jar.type=uber-jar

# Datasource pool settings (applies to all datasources)
quarkus.datasource.*.jdbc.max-size=20
quarkus.datasource.*.jdbc.min-size=1

# ==================== Datasource: hospital ====================
quarkus.datasource.hospital.db-kind=mysql
quarkus.datasource.hospital.username=user_local
quarkus.datasource.hospital.password=auUmc2FutKX5frJad3uVpNM5mnbXhzS53AygPwijprD9qfabKYebggJpJKcWCN9NmQpUf7QM7wFcyg7AWMLhFTdHXy34fX7zvrMjbe9usMnPpAWS9KF779XTEAEQE22s
quarkus.datasource.hospital.jdbc.url=jdbc:mysql://localhost:3306/db-hospital?zeroDateTimeBehavior=convertToNull

# Persistence unit for hospital
quarkus.hibernate-orm."hospital".datasource=hospital
quarkus.hibernate-orm."hospital".packages=io.github.amsatrio.modules.hospital
quarkus.hibernate-orm."hospital".database.generation=update
quarkus.hibernate-orm."hospital".log.sql=true

